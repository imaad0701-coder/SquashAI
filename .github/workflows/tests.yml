name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # engine/preprocessing/ffmpeg_wrapper.py and frame_sync.py shell out to
      # real ffmpeg/ffprobe binaries -- required for
      # tests/pipelines/test_backhand_real_video_smoke.py, which runs against
      # the committed assets/sample_videos/backhand/sample_backhand.mp4
      # fixture instead of skipping. Neither GitHub-hosted runner image ships
      # ffprobe on PATH by default.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

  status-doc-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tools/gen_status.py runs the full test suite itself (for live
      # pass/fail/skip counts) -- same ffmpeg/ffprobe requirement as above.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Regenerate docs/status_generated.md and fail if it drifted
        run: |
          python tools/gen_status.py
          git diff --exit-code -- docs/status_generated.md
